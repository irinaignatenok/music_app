  <body>
    <div class="container">
      <header>
        <img src="asset/musical.png" alt="music" />
        <h1>My Music App</h1>
      </header>
      <main>
        <div class="new_songs">
          <div class="title-content" id="new_song_header">
            <h1>NEW SONGS</h1>
          </div>
          <span id="generalError"></span>
          <label for="title">Title:</label>
          <span id="errorTitle"></span>
          <input type="text" name="title" id="title" />
          <label for="artist">Artist:</label>
          <span id="errorArtist"></span>
          <input type="text" name="artist" id="artist" />
          <button id="btnAdd">Add</button>
        </div>
        <div class="list_of_songs">
          <div class="title-content">
            <h1>LIST OF SONGS</h1>
          </div>
          <div id="addListSongs">
            <p id="song_name"></p>
            <p id="artist_name"></p>
          </div>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
